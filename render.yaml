services:
  - type: web
    name: aggie-decision-desk
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.address 0.0.0.0 --server.port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SNOWFLAKE_ACCOUNT
        sync: false
      - key: SNOWFLAKE_HOST
        sync: false
      - key: SNOWFLAKE_API_KEY
        sync: false
      - key: SNOWFLAKE_ROLE
        value: PUBLIC
      - key: SNOWFLAKE_WAREHOUSE
        value: COMPUTE_WH
      - key: SNOWFLAKE_DATABASE
        value: AGGIE_DECISION_DESK
      - key: SNOWFLAKE_SCHEMA
        value: PUBLIC
